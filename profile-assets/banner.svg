<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Backend Engineer - Java, Spring Boot, Kafka, Microservices">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#151b2e"/>
      <stop offset="100%" stop-color="#1a1240"/>
    </linearGradient>

    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="1160" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#7b5cff"/>
      <stop offset="100%" stop-color="#ff5ca8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 520 0; 0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b5cff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>

    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>

    <style>
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans  { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }

      .line  { opacity: 0; animation: reveal 14s infinite; }
      .l1 { animation-delay: 0.3s; }  .l2 { animation-delay: 1.1s; }
      .l3 { animation-delay: 1.7s; }  .l4 { animation-delay: 2.3s; }
      .l5 { animation-delay: 2.9s; }  .l6 { animation-delay: 3.5s; }
      .l7 { animation-delay: 4.1s; }  .l8 { animation-delay: 4.9s; }
      @keyframes reveal {
        0%   { opacity: 0; transform: translateX(-8px); }
        3%   { opacity: 1; transform: translateX(0); }
        88%  { opacity: 1; }
        94%, 100% { opacity: 0; }
      }

      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .flow { stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; }
      .flow.rev { animation-direction: reverse; }
      @keyframes flow { to { stroke-dashoffset: -32; } }

      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
      .d1 { animation-delay: .4s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.2s; }
      .d4 { animation-delay: 1.6s; } .d5 { animation-delay: 2s; }
      @keyframes pulse {
        0%   { transform: scale(1);   opacity: .7; }
        100% { transform: scale(2.4); opacity: 0;  }
      }

      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-6px); } }

      .fadeUp { opacity: 0; animation: fadeUp 1.2s ease-out .2s forwards; }
      .fadeUp2 { opacity: 0; animation: fadeUp 1.2s ease-out .7s forwards; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <circle cx="980" cy="60" r="220" fill="url(#glowA)">
      <animate attributeName="r" values="200;240;200" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="320" r="200" fill="url(#glowB)">
      <animate attributeName="r" values="220;180;220" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- ═════════ Terminal window ═════════ -->
    <g class="float">
      <rect x="40" y="40" width="540" height="260" rx="12" fill="#0b0f17" stroke="#30363d"/>
      <rect x="40" y="40" width="540" height="34" rx="12" fill="#161b22"/>
      <rect x="40" y="62" width="540" height="12" fill="#161b22"/>
      <circle cx="62" cy="57" r="6" fill="#ff5f56"/>
      <circle cx="82" cy="57" r="6" fill="#ffbd2e"/>
      <circle cx="102" cy="57" r="6" fill="#27c93f"/>
      <text x="310" y="62" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">quickbite — zsh</text>

      <g class="mono" font-size="15">
        <text class="line l1" x="62" y="104"><tspan fill="#27c93f">➜</tspan><tspan fill="#36bcf7"> ~/quickbite</tspan><tspan fill="#c9d1d9"> docker compose up -d</tspan></text>
        <text class="line l2" x="62" y="132" fill="#8b949e">[+] postgres · kafka · zipkin <tspan fill="#27c93f">Started</tspan></text>
        <text class="line l3" x="62" y="158"><tspan fill="#27c93f">✔</tspan><tspan fill="#c9d1d9"> config-server     </tspan><tspan fill="#27c93f">UP</tspan></text>
        <text class="line l4" x="62" y="182"><tspan fill="#27c93f">✔</tspan><tspan fill="#c9d1d9"> discovery-server  </tspan><tspan fill="#27c93f">UP</tspan></text>
        <text class="line l5" x="62" y="206"><tspan fill="#27c93f">✔</tspan><tspan fill="#c9d1d9"> api-gateway       </tspan><tspan fill="#27c93f">UP</tspan><tspan fill="#8b949e"> :8080</tspan></text>
        <text class="line l6" x="62" y="230"><tspan fill="#27c93f">✔</tspan><tspan fill="#c9d1d9"> order · payment · delivery </tspan><tspan fill="#27c93f">UP</tspan></text>
        <text class="line l7" x="62" y="254"><tspan fill="#ffbd2e">⚡</tspan><tspan fill="#c9d1d9"> kafka topics      </tspan><tspan fill="#ff5ca8">streaming</tspan></text>
        <text class="line l8" x="62" y="282"><tspan fill="#27c93f">➜</tspan><tspan fill="#36bcf7"> ~/quickbite</tspan><tspan class="cursor" fill="#c9d1d9"> ▋</tspan></text>
      </g>
    </g>

    <!-- ═════════ Title ═════════ -->
    <text x="900" y="92" text-anchor="middle" class="sans fadeUp" font-size="50" font-weight="800" fill="url(#title)" letter-spacing="1">Backend Engineer</text>
    <text x="900" y="126" text-anchor="middle" class="mono fadeUp2" font-size="16" fill="#8b949e">Java · Spring Boot · Kafka · Microservices</text>

    <!-- ═════════ Microservice network ═════════ -->
    <g stroke-width="2" fill="none">
      <path class="flow"     d="M900 232 L740 182" stroke="#36bcf7"/>
      <path class="flow"     d="M900 232 L740 290" stroke="#36bcf7"/>
      <path class="flow rev" d="M900 232 L1060 182" stroke="#7b5cff"/>
      <path class="flow rev" d="M900 232 L1060 290" stroke="#7b5cff"/>
      <path class="flow"     d="M900 232 L900 310" stroke="#ff5ca8"/>
    </g>

    <!-- outer nodes -->
    <g class="sans" font-size="12" text-anchor="middle">
      <circle class="pulse d1" cx="740"  cy="182" r="9" fill="#36bcf7"/>
      <circle cx="740"  cy="182" r="9" fill="#36bcf7"/>
      <text x="740" y="166" fill="#c9d1d9">user</text>

      <circle class="pulse d2" cx="740"  cy="290" r="9" fill="#36bcf7"/>
      <circle cx="740"  cy="290" r="9" fill="#36bcf7"/>
      <text x="740" y="316" fill="#c9d1d9">restaurant</text>

      <circle class="pulse d3" cx="1060" cy="182" r="9" fill="#7b5cff"/>
      <circle cx="1060" cy="182" r="9" fill="#7b5cff"/>
      <text x="1060" y="166" fill="#c9d1d9">order</text>

      <circle class="pulse d4" cx="1060" cy="290" r="9" fill="#7b5cff"/>
      <circle cx="1060" cy="290" r="9" fill="#7b5cff"/>
      <text x="1060" y="316" fill="#c9d1d9">payment</text>

      <circle class="pulse d5" cx="900"  cy="310" r="7" fill="#ff5ca8"/>
      <circle cx="900"  cy="310" r="7" fill="#ff5ca8"/>
      <text x="940" y="314" fill="#ff5ca8">kafka</text>
    </g>

    <!-- gateway hub -->
    <circle class="pulse" cx="900" cy="232" r="22" fill="#00d2ff"/>
    <circle cx="900" cy="232" r="22" fill="#0d1117" stroke="#00d2ff" stroke-width="2.5"/>
    <circle cx="900" cy="232" r="30" fill="none" stroke="#00d2ff" stroke-opacity=".35" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0 900 232" to="360 900 232" dur="12s" repeatCount="indefinite"/>
    </circle>
    <text x="900" y="237" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#00d2ff">API</text>
  </g>
</svg>
