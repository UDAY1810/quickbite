eureka:
  instance:
    # In Docker each container sets EUREKA_INSTANCE_HOSTNAME to its service name,
    # otherwise every service would register as "localhost" and the gateway couldn't reach it.
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans
spring:
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
